<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Color Square</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#f4f4f4;
    font-family:system-ui, sans-serif;
}
#square{
    width:300px;
    height:300px;
    display:block;
    flex-shrink:0;
    border-radius:4px;
    box-shadow:0 4px 12px #00000022;
}
#colorText{
    margin-top:24px;
    font-size:32px;
    font-weight:bold;
    letter-spacing:2px;
}
</style>
</head>
<body>
<div id="square"></div>
<div id="colorText"></div>

<script>
function getRandomHex(){
    const hexChars = '0123456789ABCDEF';
    let hex = '';
    for(let i=0;i<6;i++){
        hex += hexChars[Math.floor(Math.random()*16)];
    }
    return hex;
}
const colorCode = getRandomHex();
const fullColor = `#${colorCode}`;

document.getElementById('colorText').textContent = colorCode;
document.getElementById('square').style.backgroundColor = fullColor;
</script>
</body>
</html>
