<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Color Square</title>
<style>
body{
    margin:0;
    padding:0;
    min-height:100vh;
    text-align:center;
    background:#f4f4f4;
    padding-top:20vh;
}
#colorText{
    margin-top:24px;
    font-size:32px;
    font-weight:bold;
}
</style>
</head>
<body>
<div id="square" style="width:300px;height:300px;margin:0 auto;border-radius:4px;box-shadow:0 4px 12px #00000022;">&nbsp;</div>
<div id="colorText"></div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    function getRandomHex(){
        const hexChars = '0123456789ABCDEF';
        let hex = '';
        for(let i=0;i<6;i++){
            hex += hexChars[Math.floor(Math.random()*16)];
        }
        return hex;
    }
    const colorCode = getRandomHex();
    const fullColor = `#${colorCode}`;

    document.getElementById('square').style.backgroundColor = fullColor;
    document.getElementById('colorText').textContent = colorCode;
});
</script>
</body>
</html>
